name: Build Android App Bundle (.AAB) for Google Play

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck & Build Web Application
        run: |
          npm run lint
          npm run build
          rm -f dist/*.apk dist/*.aab dist/*.abb dist/*.idsig

      - name: Install & Configure Capacitor
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Positron" "com.sacred.diary" --web-dir dist
          npx cap add android
          npx cap sync

      - name: Build Release & Debug AAB Bundle with Gradle
        working-directory: android
        run: |
          ./gradlew bundleRelease || ./gradlew bundleDebug

      - name: Upload Android App Bundle (.AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacred-reflection-diary-release-aab
          path: android/app/build/outputs/bundle/*/*.aab
